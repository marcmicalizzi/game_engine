# Build and test on the two self-hosted machines that have a real Vulkan driver
# (docs/ci/self-hosted-runners.md, docs/plan/10-roadmap-risks.md section 10.4).
# The hosted runners in ci.yml have a Vulkan loader but no device behind it, so
# every GPU test skips there; these two cover the baseline tier: a GTX Titan X
# (Maxwell) on Windows and a headless GTX Titan Xp (Pascal) on Linux. Neither has
# mesh shaders or ray tracing, so the mesh-shader, software-raster, occlusion,
# and shading tests skip and the vertex path, cull, LOD, and resolve tests run.
#
# Only workflow_dispatch and schedule trigger this, which is also what keeps it
# away from pull requests: self-hosted runners must never execute code from a
# fork. ci.yml stays the gate for every push and pull request and is not touched
# from here.
name: GPU

on:
  workflow_dispatch:
    inputs:
      clean:
        description: Delete build/<preset> before building (a from-scratch run)
        type: boolean
        default: false
  schedule:
    # Mondays, 06:17 UTC. An odd minute, as GitHub asks, to spread the load.
    - cron: '17 6 * * 1'
    # Nightly, 07:41 UTC: the reference comparison only (docs/plan/04-renderer.md section 4.8,
    # "reference comparisons run nightly" in 10 section 10.2). The two baseline-tier machines
    # above stay weekly — a Maxwell and a Pascal cannot run the reference at all, since it traces
    # the frame's cluster acceleration structures, and building them nightly buys nothing.
    - cron: '41 7 * * *'

# One GPU per machine: let a running job finish rather than cancelling it.
concurrency:
  group: gpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Both GPU runners build an x86-64-v2 preset, because both CPUs are v2 and the tree's promised
  # minimum is x86-64-v3 since ADR-0031: an i7-980 (Westmere, no AVX at all) here and a Xeon
  # E5-2670 (Sandy Bridge, AVX but no AVX2/FMA/BMI2) on the Linux job below. A v3 binary refuses
  # to start on either, by design and with a sentence naming the missing features.
  # The Linux job builds linux-server-debug, which is linux-clang-debug-v2 plus
  # ENGINE_WINDOW_BACKENDS=none: the server has a partial X11, so SDL's configure picks the X11
  # backend and stops on the missing Xcursor unless it is told there is no window backend
  # (docs/ci/self-hosted-runners.md, docs/ci/remote-linux.md). Until 2026-10-07 this job named
  # linux-clang-debug-v2, the preset without that switch.
  # These are not one machine's exception: they are the project's only two GPU machines that are
  # not the development desktop, and the Linux one is the only Linux GPU coverage there is.
  # docs/ci/self-hosted-runners.md says what would retire them.
  windows-maxwell:
    name: Windows msvc-release-v2 (GTX Titan X, Maxwell)
    runs-on: [self-hosted, windows, gpu]
    # Weekly and on demand, not on the nightly reference schedule.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Self-hosted runners keep their workspace between runs; leaving
          # build/ in place makes this an incremental build, which is what fits
          # in the timeout on an i7-980. Use the clean input for a full rebuild.
          clean: false

      - name: Clean build directory
        if: ${{ inputs.clean }}
        shell: pwsh
        run: ./tools/dev.ps1 clean -Preset msvc-release-v2

      - name: GPU smoke
        shell: pwsh
        run: ./tools/ci/gpu-smoke.ps1 -Preset msvc-release-v2

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lasttest-windows-msvc-release-v2
          path: build/msvc-release-v2/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

      # The run's own record: the adapter report, the ctest status, and one
      # entry per extreme resolution with engine-view's JSON summary, beside
      # the pictures themselves. Uploaded on failure too, because a run where
      # one resolution died is exactly the one worth looking at.
      - name: Upload smoke report and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-windows-msvc-release-v2
          path: |
            build/msvc-release-v2/gpu-smoke.json
            build/msvc-release-v2/captures/
          if-no-files-found: warn
          retention-days: 30

  linux-pascal:
    name: Linux linux-server-debug (GTX Titan Xp, Pascal, headless)
    runs-on: [self-hosted, linux, gpu]
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean build directory
        if: ${{ inputs.clean }}
        run: pwsh -NoProfile -File ./tools/dev.ps1 clean -Preset linux-server-debug

      - name: GPU smoke
        run: bash ./tools/ci/gpu-smoke.sh --preset linux-server-debug

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lasttest-linux-server-debug
          path: build/linux-server-debug/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

      # Same record on this machine, where every resolution skips: it is
      # headless, so engine-view exits 3. The file says "skipped" five times
      # rather than nothing, which is the difference between a machine that
      # cannot draw and a step that did not run.
      - name: Upload smoke report and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-linux-server-debug
          path: |
            build/linux-server-debug/gpu-smoke.json
            build/linux-server-debug/captures/
          if-no-files-found: warn
          retention-days: 30

  # The reference comparison (docs/plan/04-renderer.md section 4.8, docs/subsystems/renderer.md
  # "Reference renderer"): the scene corpus rendered through the real-time path and through the
  # reference path tracer, compared, and failed when a scene exceeds the FLIP threshold stored
  # with it.
  #
  # **No runner carries the `rtx` label yet.** The two machines above are a Maxwell and a Pascal,
  # and the reference traces the frame's *cluster* acceleration structures, which neither has —
  # so this job waits for a runner with an RTX card rather than being pointed at a machine that
  # would skip every scene. Until one is registered the job queues and is never picked up, and
  # the script is run by hand on the development box:
  #
  #     pwsh tools/ci/reference-compare.ps1 -Preset msvc-release
  #
  # docs/ci/self-hosted-runners.md is the setup; the label to add is `rtx`.
  reference:
    name: Reference comparison (RTX, msvc-release)
    runs-on: [self-hosted, windows, gpu, rtx]
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '41 7 * * *' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Fetch sample assets
        shell: pwsh
        # The corpus names Khronos samples that git ignores; a scene whose mesh is missing is
        # skipped rather than failed, so this step is a convenience and not a gate.
        run: ./tools/fetch-samples.ps1
        continue-on-error: true

      - name: Build
        shell: pwsh
        run: ./tools/dev.ps1 build -Preset msvc-release

      - name: Reference comparison
        shell: pwsh
        run: ./tools/ci/reference-compare.ps1 -Preset msvc-release

      # The report and every picture it names, on failure too: a run where one scene went over
      # its threshold is exactly the one whose heat map is worth looking at.
      - name: Upload report and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-compare-msvc-release
          path: build/msvc-release/reference/
          if-no-files-found: warn
          retention-days: 30
