# Build, test, lint, and bench-smoke on Windows and Linux (docs/plan/10-roadmap-risks.md §10.1,
# ADR-0021). Presets come from CMakePresets.json; the release presets compile Tracy in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The documentation diff gate (AGENTS.md, "Documentation moves with the code"): a change to an
  # interface lands with the documentation that describes it. It reads the change's file list and
  # its commit messages, so it needs no toolchain and no build and answers in seconds — which is
  # why it is its own job rather than a step inside one that takes twenty minutes.
  docs:
    name: Documentation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The push case diffs github.event.before..github.sha, which needs the history that
          # holds both; the gate falls back to the head commit alone when it does not.
          fetch-depth: 0
      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
              --jq '.[].filename' > /tmp/docs-gate-files.txt
            gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.number }}/commits" \
              --jq '.[].commit.message' > /tmp/docs-gate-messages.txt
            tools/docs-gate.sh --files-from /tmp/docs-gate-files.txt --messages-from /tmp/docs-gate-messages.txt
          else
            tools/docs-gate.sh --base '${{ github.event.before }}' --head '${{ github.sha }}'
          fi
      - name: Documentation check
        run: tools/docs-check.sh
      # The licence check ADR-0014 promised (tools/license-check.ps1): the record against the policy
      # and against every FetchContent declaration, with no build. The jobs below run it again as
      # the CTest test lint.licenses, over the licence files their configure fetched.
      - name: Licence check
        run: pwsh -NoProfile -File tools/license-check.ps1

  windows:
    name: Windows ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # msvc-asan is msvc-debug with MSVC's AddressSanitizer (T66; docs/ci/what-to-run.md,
        # "Sanitizers"): the Windows half of the sanitizer job, which reaches what linux-clang-asan
        # cannot — MSVC's code generation and the Windows paths. It blocks like the others since
        # 2026-10-09, when it first ran 96 of 96. The runtime DLL it loads is beside cl.exe, which
        # msvc-dev-cmd puts on PATH for the build and the tests alike.
        preset: [msvc-debug, msvc-release, msvc-asan]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Module graph
        run: Get-Content build/${{ matrix.preset }}/modules.json
        shell: pwsh

  linux:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # linux-clang-minimal is the minimal build (ADR-0027): ENGINE_MINIMAL=ON turns every
        # optional capability off, which proves the rest of the tree does not depend on any of
        # them. It duplicates linux-clang-debug until the first capability lands, and is cheaper
        # to run from the start than to add once four capabilities each assume another is there.
        #
        # linux-clang-no-ecs is the configuration in between, and it is the one that exercises the
        # **capability graph** rather than the switch: everything on except `ecs`, so `animation`
        # has to follow it off through `engine_capability_requires` and the rest of the tree has to
        # build without either. All-on and all-off both pass with a broken graph — all-on never
        # consults it and all-off switches everything off for a different reason — so this job is
        # the only one that would catch a capability that links another and forgot to declare it.
        #
        # linux-clang-asan is linux-clang-debug with AddressSanitizer and UndefinedBehaviorSanitizer,
        # undefined behaviour fatal (-fno-sanitize-recover) and leaks reported (T11; docs/ci/
        # what-to-run.md, "Sanitizers"). tools/linux-build.ps1 -Preset linux-clang-asan runs the
        # same configuration in the local container. It blocks like the others since 2026-10-09,
        # when the first run's findings (roadmap F13 to F16 and F19) were closed and it ran 96 of 96.
        preset: [linux-clang-debug, linux-gcc-release, linux-clang-minimal, linux-clang-no-ecs, linux-clang-asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          # libclang-rt-18-dev: Clang's sanitizer runtimes, which linux-clang-asan links; named so
          # the job does not depend on the image or on apt installing what clang only recommends.
          # llvm: for llvm-symbolizer, which the sanitizer runtimes need on PATH to print a report's
          # stack as function, file and line instead of bare addresses (F14 came back unreadable).
          sudo apt-get install -y ninja-build clang libclang-rt-18-dev llvm g++ \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev \
            libxtst-dev libdecor-0-dev libudev-dev
          cmake --version && ninja --version && clang++ --version && g++ --version && pwsh --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Module graph
        run: cat build/${{ matrix.preset }}/modules.json
